<template id="tpl-multiplayer-pause-menu">
  <button type="button" class="home-back-button" aria-label="Game menu" aria-hidden="true">
    <span class="home-back-button__icon" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="home-back-button__label">MENU</span>
  </button>
  <div class="game-menu" aria-label="Game menu" role="dialog" aria-modal="true">
    <div class="game-menu-panel">
      <h2>MENU</h2>
      <button type="button" class="game-menu-close" aria-label="Resume game">×</button>
      <p class="game-menu-note">Pausing freezes the match for both players.</p>
      <button type="button" class="game-menu-button game-menu-button--primary">RESUME</button>
      <button type="button" class="game-menu-button" data-pause-menu-action="sound">SOUND ON</button>
      <button type="button" class="game-menu-button" data-pause-menu-action="advanced-hud"
        aria-pressed="false">ADVANCED HUD OFF</button>
      <div class="game-menu-zoom" role="group" aria-label="Board zoom">
        <span class="game-menu-zoom__label">ZOOM</span>
        <button type="button" class="game-menu-zoom__button" data-pause-menu-action="zoom-out"
          aria-label="Zoom out">&minus;</button>
        <button type="button" class="game-menu-zoom__button" data-pause-menu-action="zoom-reset"
          aria-label="Reset zoom">&#8634;</button>
        <button type="button" class="game-menu-zoom__button" data-pause-menu-action="zoom-in"
          aria-label="Zoom in">+</button>
      </div>
      <button type="button" class="game-menu-button" data-pause-menu-action="forfeit">FORFEIT MATCH</button>
    </div>
  </div>
</template>
