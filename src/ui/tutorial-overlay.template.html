<template id="tpl-tutorial-overlay">

    <div class="tutorial-eyebrow"></div>
    <div class="tutorial-title"></div>
    <div class="tutorial-prompt"></div>
    <div class="tutorial-actions">
      <button type="button" class="tutorial-button" data-tutorial-action="retry">RETRY</button>

    </div>
  </div>
</template>
