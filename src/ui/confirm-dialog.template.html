<template id="tpl-confirm-dialog">
  <div class="restart-confirmation" role="alertdialog" aria-modal="true">
    <div class="restart-confirmation__panel">
      <h2 class="restart-confirmation__title"></h2>
      <p class="restart-confirmation__description"></p>
      <div class="restart-confirmation__actions">
        <button type="button" class="restart-confirmation__button" data-confirm-dialog-action="cancel">CANCEL</button>
        <button type="button" class="restart-confirmation__button restart-confirmation__button--danger"></button>
      </div>
    </div>
  </div>
</template>
