<template id="tpl-multiplayer-hud">
  <section class="multiplayer-hud" aria-label="Multiplayer match status">
    <span class="multiplayer-hud__metric multiplayer-hud__match">
      <span class="multiplayer-hud__label">SCORE RACE</span>
      <strong class="multiplayer-hud__status"></strong>
    </span>
    <span class="multiplayer-hud__metric multiplayer-hud__local">
      <span class="multiplayer-hud__label">YOU</span>
      <strong class="multiplayer-hud__local-value"></strong>
    </span>
    <span class="multiplayer-hud__metric multiplayer-hud__opponent">
      <span class="multiplayer-hud__label">OPPONENT</span>
      <strong class="multiplayer-hud__opponent-value"></strong>
    </span>
    <span class="multiplayer-hud__metric multiplayer-hud__clock">
      <span class="multiplayer-hud__label multiplayer-hud__timer-label"></span>
      <strong class="multiplayer-hud__timer"></strong>
    </span>
    <strong class="multiplayer-hud__result"></strong>
  </section>
</template>
