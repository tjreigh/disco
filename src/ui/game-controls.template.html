<template id="tpl-game-controls">
  <div class="game-controls" aria-label="Gameplay controls" hidden>
    <button type="button" class="game-control game-control--previous" data-control="previous"
      aria-label="Move to previous lane" title="Move to previous lane">‹</button>
    <button type="button" class="game-control game-control--tilt-counter-clockwise" data-control="tilt-counter-clockwise"
      aria-label="Tilt counter-clockwise" title="Tilt counter-clockwise">↺</button>
    <button type="button" class="game-control game-control--cancel" data-control="cancel"
      aria-label="Cancel tilt" title="Cancel tilt">CANCEL</button>
    <button type="button" class="game-control game-control--drop" data-control="drop"
      aria-label="Drop disc in selected lane" title="Drop disc in selected lane">DROP</button>
    <button type="button" class="game-control game-control--confirm" data-control="confirm"
      aria-label="Confirm tilt" title="Confirm tilt">CONFIRM</button>
    <button type="button" class="game-control game-control--tilt-clockwise" data-control="tilt-clockwise"
      aria-label="Tilt clockwise" title="Tilt clockwise">↻</button>
    <button type="button" class="game-control game-control--next" data-control="next"
      aria-label="Move to next lane" title="Move to next lane">›</button>
    <button type="button" class="game-control game-control--rewind" data-control="rewind"
      aria-label="Rewind previous turns" title="Rewind previous turns" aria-keyshortcuts="Z">REWIND</button>
  </div>
</template>
