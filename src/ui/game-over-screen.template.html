<template id="tpl-game-over-screen">
  <section class="game-over-screen" role="dialog" aria-modal="true" aria-labelledby="game-over-title" aria-hidden="true">
    <div class="game-over-panel">
      <h2 id="game-over-title">GAME OVER</h2>
      <div class="game-over-highlights" hidden></div>
      <p class="game-over-score"></p>
      <p class="game-over-score-context" hidden></p>
      <div class="game-over-run-summary">
        <p class="game-over-reason"></p>
        <p class="game-over-run-record"></p>
      </div>
      <section class="game-over-run-stats" aria-labelledby="game-over-run-stats-title">
        <h3 id="game-over-run-stats-title">
          <button type="button" class="game-over-run-stats__toggle" aria-expanded="false"
            aria-controls="game-over-run-stats-details">
            <span class="game-over-run-stats__copy">
              <span class="game-over-run-stats__title">ADVANCED RUN STATS</span>
              <span class="game-over-run-stats__hint">TIME · DISCS · PER-MINUTE RATES</span>
            </span>
            <span class="game-over-run-stats__chevron" aria-hidden="true"></span>
          </button>
        </h3>
        <dl class="game-over-run-stats__details" id="game-over-run-stats-details" hidden>
          <div><dt>TIME</dt><dd data-run-stat="time"></dd></div>
          <div><dt>DROPPED</dt><dd data-run-stat="dropped"></dd></div>
          <div><dt>BROKEN</dt><dd data-run-stat="broken"></dd></div>
          <div><dt>SCORE / MIN</dt><dd data-run-stat="score-rate"></dd></div>
          <div><dt>DROPS / MIN</dt><dd data-run-stat="drop-rate"></dd></div>
          <div><dt>BROKEN / MIN</dt><dd data-run-stat="broken-rate"></dd></div>
        </dl>
      </section>
      <p class="game-over-records"></p>
      <p class="game-over-average"></p>
      <div class="game-over-actions">
        <button type="button" class="game-over-button game-over-button--rewind">REWIND</button>
        <button type="button" class="game-over-button game-over-button--primary">NEW GAME</button>
        <button type="button" class="game-over-button" data-ui-ref="home">HOME</button>
      </div>
    </div>
  </section>
</template>
