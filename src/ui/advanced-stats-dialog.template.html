<template id="tpl-advanced-stats-dialog">
  <section class="advanced-stats-dialog" role="dialog" aria-modal="true"
    aria-labelledby="advanced-stats-dialog-title" aria-hidden="true">
    <div class="advanced-stats-dialog__panel">
      <header class="advanced-stats-dialog__header">
        <div>
          <span>PLAYER HISTORY</span>
          <h2 id="advanced-stats-dialog-title">ADVANCED STATS</h2>
        </div>
        <button type="button" class="advanced-stats-dialog__close" aria-label="Close advanced stats">×</button>
      </header>
      <p class="advanced-stats-dialog__note">Totals include completed solo games.</p>
      <div class="advanced-stats-dialog__content"></div>
    </div>
  </section>
</template>
