<template id="tpl-rewind-dialog">
  <section class="rewind-dialog" role="dialog" aria-modal="true"
    aria-labelledby="rewind-dialog-title" aria-describedby="rewind-dialog-consequence">
    <div class="rewind-panel">
      <div class="rewind-panel__copy">
        <p class="rewind-panel__eyebrow">PARADOX</p>
        <h2 id="rewind-dialog-title"></h2>
        <p class="rewind-panel__intro">Inspect the restored board before committing the rewind.</p>
        <div class="rewind-panel__depths" role="group" aria-label="Turns to rewind"></div>
        <p class="rewind-panel__instability"></p>
        <p class="rewind-panel__consequence" id="rewind-dialog-consequence"></p>
        <p class="rewind-panel__rescue"></p>
      </div>
      <div class="rewind-panel__actions">
        <button type="button" class="rewind-panel__button rewind-panel__button--primary">CONFIRM REWIND</button>
        <button type="button" class="rewind-panel__button" data-rewind-action="cancel">KEEP TURN</button>
      </div>
    </div>
  </section>
</template>
