<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Disco</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
      cursor: pointer;
    }
    .debug-toggle {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 20;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #9fb3c8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .debug-panel {
      position: fixed;
      z-index: 30;
      top: 0;
      right: 0;
      width: min(440px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #d9e2ec;
      background: rgba(9, 22, 38, .98);
      border-left: 1px solid #334e68;
      box-shadow: -12px 0 30px rgba(0, 0, 0, .45);
      transform: translateX(102%);
      transition: transform 150ms ease-out;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .debug-panel--open { transform: translateX(0); }
    .debug-panel > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid #334e68;
      color: #62b0e8;
      letter-spacing: .08em;
    }
    .debug-panel > header button {
      border: 0;
      padding: 4px 8px;
      color: #9fb3c8;
      background: transparent;
      font: 24px/1 sans-serif;
      cursor: pointer;
    }
    .debug-content {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }
    .debug-content h2 {
      margin: 18px 0 8px;
      color: #9fb3c8;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .debug-summary, .debug-alert, .debug-ok {
      padding: 9px 10px;
      border-radius: 4px;
      line-height: 1.45;
    }
    .debug-summary { background: #102a43; color: #bcccdc; }
    .debug-alert { margin-top: 10px; border: 1px solid #d64545; background: #4b1d26; color: #ffb3b3; }
    .debug-ok { margin-top: 10px; border: 1px solid #287d57; background: #123b32; color: #8ae6bd; }
    .debug-muted { margin: 12px 0; color: #829ab1; line-height: 1.5; }
    .debug-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      width: 100%;
    }
    .debug-cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #334e68;
      border-radius: 3px;
      background: #102a43;
      color: #f0f4f8;
      font-weight: 700;
    }
    .debug-cell--empty { color: #486581; font-weight: 400; }
    .debug-cell--single-cracked, .debug-cell--double-cracked { background: #3e4c59; color: #d9e2ec; }
    .debug-cell--clearable {
      border-color: #ff6b6b;
      background: #7b2531;
      color: #fff;
      box-shadow: inset 0 0 0 1px #ff6b6b;
    }
    .debug-grid--compact { margin-top: 8px; max-width: 300px; }
    .debug-grid--compact .debug-cell { font-size: 10px; }
    .debug-content pre {
      margin: 7px 0;
      padding: 8px;
      overflow-x: auto;
      border-radius: 3px;
      background: #071a2b;
      color: #bcccdc;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    .debug-steps { color: #d9e2ec !important; }
    .debug-content details {
      margin: 5px 0;
      padding: 6px 8px;
      border: 1px solid #243b53;
      border-radius: 3px;
      background: #0b2034;
    }
    .debug-content summary { color: #9fb3c8; cursor: pointer; line-height: 1.4; }
    @media (max-width: 600px) {
      .debug-panel { width: 100vw; }
      .debug-toggle { top: 6px; right: 6px; }
    }
  </style>
</head>
<body>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
