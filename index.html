<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Disco</title>
  <style>
    :root { --game-controls-height: 72px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #1a1a2e;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    .app-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #1a1a2e;
    }
    .shell-region {
      min-height: 0;
      pointer-events: none;
    }
    .shell-region--top {
      min-height: env(safe-area-inset-top);
    }
    .game-hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: #f0f4f8;
      pointer-events: none;
    }
    .game-hud[hidden] { display: none; }
    .game-hud__top,
    .game-hud__bottom {
      position: absolute;
      left: 50%;
      width: min(100%, var(--game-canvas-width, 680px));
      transform: translateX(-50%);
    }
    .game-hud__top {
      top: calc(50% - var(--game-canvas-height, 0px) / 2);
      height: 96px;
      padding: 10px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    }
    .game-hud__bottom {
      top: calc(50% + var(--game-canvas-height, 0px) / 2 - 80px);
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: max(16px, env(safe-area-inset-left), calc((var(--game-canvas-width, 680px) - var(--game-grid-width, 504px)) / 2));
      padding-right: max(16px, env(safe-area-inset-right), calc((var(--game-canvas-width, 680px) - var(--game-grid-width, 504px)) / 2));
    }
    .game-hud__summary {
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 0;
      height: 100%;
      font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .game-hud__score { margin-bottom: 12px; font-size: 24px; line-height: 1.1; color: #ffffff; }
    .game-hud[data-stack-mode="true"] .game-hud__score { margin-bottom: 5px; }
    .game-hud__stack { margin-bottom: 3px; color: #62b0e8; font-size: 11px; white-space: nowrap; }
    .game-hud__level { margin-top: 7px; color: #a0aec0; white-space: nowrap; }
    .game-hud__turns { display: grid; justify-items: center; gap: 7px; color: #a0aec0; white-space: nowrap; }
    .game-hud__pips {
      display: flex;
      justify-content: space-between;
      width: var(--game-grid-width, 504px);
      max-width: min(var(--game-grid-width, 504px), calc(100vw - 32px));
      padding-inline: 1px;
    }
    .game-hud__pip {
      flex: 0 0 auto;
      width: clamp(9px, calc(var(--game-grid-width, 504px) / 32), 16px);
      height: clamp(9px, calc(var(--game-grid-width, 504px) / 32), 16px);
      border: 1px solid #718096;
      border-radius: 50%;
    }
    .game-hud__pip--remaining { background: #f0f4f8; border-color: #f0f4f8; }
    .game-hud__pip--placeholder { visibility: hidden; }
    .game-hud__queue {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .game-hud__disc-slot { display: inline-flex; align-items: center; gap: 6px; color: #cbd5e1; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .game-hud__disc-caption { text-transform: uppercase; }
    .game-hud__disc {
      position: relative;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.35);
      border-radius: 50%;
      color: #fff;
      font: 700 15px system-ui, sans-serif;
      box-shadow: 0 2px 5px rgba(0,0,0,.35);
    }
    .game-hud__disc[data-kind="numbered"][data-value="1"] { background: radial-gradient(circle at 35% 35%, rgb(255,165,149), #e74c3c); }
    .game-hud__disc[data-kind="numbered"][data-value="2"] { background: radial-gradient(circle at 35% 35%, rgb(255,215,123), #e67e22); }
    .game-hud__disc[data-kind="numbered"][data-value="3"] { background: radial-gradient(circle at 35% 35%, rgb(255,255,104), #f1c40f); }
    .game-hud__disc[data-kind="numbered"][data-value="4"] { background: radial-gradient(circle at 35% 35%, rgb(135,255,202), #2ecc71); }
    .game-hud__disc[data-kind="numbered"][data-value="5"] { background: radial-gradient(circle at 35% 35%, rgb(141,241,255), #3498db); }
    .game-hud__disc[data-kind="numbered"][data-value="6"] { background: radial-gradient(circle at 35% 35%, rgb(244,178,255), #9b59b6); }
    .game-hud__disc[data-kind="numbered"][data-value="7"] { background: radial-gradient(circle at 35% 35%, rgb(115,255,245), #1abc9c); }
    .game-hud__disc[data-kind="single-cracked"],
    .game-hud__disc[data-kind="double-cracked"] {
      background: radial-gradient(circle at 37.5% 37.5%, #4a5568, #2d3748);
    }
    .game-hud__disc-crack {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .game-hud__disc-crack i {
      position: absolute;
      display: block;
      height: 2px;
      border-radius: 999px;
      background: #e2e8f0;
      transform-origin: left center;
    }
    .game-hud__disc-crack--primary i:first-child { left: 40%; top: 22.5%; width: 24%; transform: rotate(69deg); }
    .game-hud__disc-crack--primary i:last-child { left: 48.5%; top: 45%; width: 37.5%; transform: rotate(65deg); }
    .game-hud__disc-crack--secondary i:first-child { left: 69%; top: 26%; width: 27%; transform: rotate(127deg); }
    .game-hud__disc-crack--secondary i:last-child { left: 53%; top: 47.5%; width: 34.5%; transform: rotate(124deg); }
    .game-hud__gravity {
      position: absolute;
      top: max(6px, env(safe-area-inset-top));
      right: max(6px, env(safe-area-inset-right), calc((var(--game-canvas-width, 680px) - var(--game-grid-width, 504px)) / 2));
      width: 48px;
      height: 48px;
    }
    .game-hud__gravity[hidden] { display: none; }
    .game-hud__gravity-dial { display: block; width: 100%; height: 100%; overflow: visible; }
    .game-hud__gravity-attention-ring { opacity: 0; }
    .game-hud__gravity--attention .game-hud__gravity-attention-ring {
      opacity: 1;
      animation: gravity-attention-ring 1s ease-in-out infinite;
    }
    @keyframes gravity-attention-ring {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    .game-hud__gravity-sr {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .game-hud__hint { max-width: 55%; color: #a0aec0; font-size: 10px; text-align: right; }
    .game-hud__hint--attention {
      color: #9ecdf0;
      animation: hint-attention 1s ease-in-out infinite;
    }
    .game-hud__hint--ready {
      color: #81e6b3;
      font-weight: 700;
    }
    @keyframes hint-attention {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-hud__hint--attention,
      .game-hud__gravity--attention .game-hud__gravity-attention-ring {
        animation: none;
      }
      .game-hud__gravity--attention .game-hud__gravity-attention-ring { opacity: 0.7; }
    }
    @media (max-width: 720px), (pointer: coarse) {
      .game-hud__summary {
        font-size: 12px;
      }
      .game-hud__score {
        font-size: 22px;
      }
      .game-hud__hint { max-width: 58%; }
    }
    @media (max-width: 420px) {
      .game-hud__top { height: 96px; }
      .game-hud__bottom { height: 80px; }
      .game-hud__disc { width: 27px; height: 27px; font-size: 14px; }
      .game-hud__disc-slot { gap: 4px; font-size: 9px; }
      .game-hud__hint { max-width: 54%; font-size: 9px; }
      .game-hud__gravity { width: 40px; height: 40px; }
    }
    .shell-region--bottom {
      display: grid;
      place-items: center;
      min-height: calc(var(--game-controls-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
    }
    .game-controls {
      pointer-events: auto;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(500px, calc(100vw - 24px));
      min-height: 64px;
      padding: 8px 0;
    }
    .game-control {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #f0f4f8;
      font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      touch-action: manipulation;
    }
    .game-control--drop, .game-control--confirm { min-width: 76px; background: #1769aa; border-color: #62b0e8; }
    .game-control:hover:not(:disabled) { border-color: #62b0e8; background: #16324f; }
    .game-control:disabled { opacity: .38; cursor: default; }
    .game-control[hidden] { display: none; }
    .game-control--attention:not(:disabled) {
      border-color: #62b0e8;
      animation: game-control-attention 1s ease-in-out infinite;
    }
    .game-control--ready:not(:disabled) {
      border-color: #81e6b3;
      background: #147d64;
      animation: game-control-ready 1s ease-in-out infinite;
    }
    @keyframes game-control-attention {
      0%, 100% { box-shadow: 0 0 0 0 rgba(98, 176, 232, 0); }
      50% { box-shadow: 0 0 0 6px rgba(98, 176, 232, 0.35); }
    }
    @keyframes game-control-ready {
      0%, 100% { box-shadow: 0 0 0 0 rgba(129, 230, 179, 0); }
      50% { box-shadow: 0 0 0 6px rgba(129, 230, 179, 0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-control--attention:not(:disabled) {
        animation: none;
        box-shadow: 0 0 0 2px rgba(98, 176, 232, 0.45);
      }
      .game-control--ready:not(:disabled) {
        animation: none;
        box-shadow: 0 0 0 2px rgba(129, 230, 179, 0.55);
      }
    }
    @media (max-width: 420px) {
      .game-controls { gap: 4px; width: calc(100vw - 12px); }
      .game-control { min-width: 40px; padding-inline: 7px; }
      .game-control--drop, .game-control--confirm { min-width: 68px; }
    }
    @media (hover: hover) and (pointer: fine) and (min-width: 721px) {
      :root { --game-controls-height: 0px; }
      .shell-region--bottom { min-height: 0; padding-bottom: 0; }
      .game-controls { display: none; }
    }
    .game-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      flex: none;
      touch-action: none;
      cursor: pointer;
    }
    .debug-toggle {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      z-index: 20;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #9fb3c8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .debug-panel {
      position: fixed;
      z-index: 30;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      width: min(440px, 100vw);
      display: flex;
      flex-direction: column;
      color: #d9e2ec;
      background: rgba(9, 22, 38, .98);
      border-left: 1px solid #334e68;
      box-shadow: -12px 0 30px rgba(0, 0, 0, .45);
      transform: translateX(102%);
      visibility: hidden;
      transition: transform 150ms ease-out, visibility 0s linear 150ms;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .debug-panel--open { transform: translateX(0); visibility: visible; transition: transform 150ms ease-out; }
    .debug-panel > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid #334e68;
      color: #62b0e8;
      letter-spacing: .08em;
    }
    .debug-panel > header button {
      border: 0;
      padding: 4px 8px;
      color: #9fb3c8;
      background: transparent;
      font: 24px/1 sans-serif;
      cursor: pointer;
    }
    .debug-content {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }
    .debug-content h2 {
      margin: 18px 0 8px;
      color: #9fb3c8;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .debug-summary, .debug-alert, .debug-ok {
      padding: 9px 10px;
      border-radius: 4px;
      line-height: 1.45;
    }
    .debug-summary { background: #102a43; color: #bcccdc; }
    .debug-alert { margin-top: 10px; border: 1px solid #d64545; background: #4b1d26; color: #ffb3b3; }
    .debug-ok { margin-top: 10px; border: 1px solid #287d57; background: #123b32; color: #8ae6bd; }
    .debug-muted { margin: 12px 0; color: #829ab1; line-height: 1.5; }
    .debug-grid {
      display: grid;
      gap: 3px;
      width: 100%;
    }
    .debug-cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #334e68;
      border-radius: 3px;
      background: #102a43;
      color: #f0f4f8;
      font-weight: 700;
    }
    .debug-cell--empty { color: #486581; font-weight: 400; }
    .debug-cell--single-cracked, .debug-cell--double-cracked { background: #3e4c59; color: #d9e2ec; }
    .debug-cell--clearable {
      border-color: #ff6b6b;
      background: #7b2531;
      color: #fff;
      box-shadow: inset 0 0 0 1px #ff6b6b;
    }
    .debug-cell--flaggable { cursor: pointer; }
    .debug-cell--flagged {
      outline: 3px solid #ffc857;
      outline-offset: -3px;
      box-shadow: inset 0 0 0 1px #1a1a2e;
    }
    .debug-grid--compact { margin-top: 8px; max-width: 300px; }
    .debug-grid--compact .debug-cell { font-size: 10px; }
    .debug-content pre {
      margin: 7px 0;
      padding: 8px;
      overflow-x: auto;
      border-radius: 3px;
      background: #071a2b;
      color: #bcccdc;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    .debug-steps { color: #d9e2ec !important; }
    .debug-content details {
      margin: 5px 0;
      padding: 6px 8px;
      border: 1px solid #243b53;
      border-radius: 3px;
      background: #0b2034;
    }
    .debug-content summary { color: #9fb3c8; cursor: pointer; line-height: 1.4; }
    .debug-report textarea {
      width: 100%;
      resize: vertical;
      padding: 8px;
      border: 1px solid #486581;
      border-radius: 3px;
      color: #f0f4f8;
      background: #071a2b;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .debug-report-actions, .debug-flag-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .debug-report-actions { justify-content: space-between; margin-top: 8px; color: #9fb3c8; }
    .debug-report-actions button, .debug-flag {
      border: 1px solid #486581;
      border-radius: 3px;
      padding: 5px 7px;
      background: #102a43;
      color: #bcccdc;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    .debug-report-actions button { color: #fff; background: #1769aa; border-color: #62b0e8; }
    .debug-flag-row {
      align-items: flex-start;
      margin: 5px 0;
      padding: 7px;
      border-radius: 3px;
      background: #071a2b;
    }
    .debug-flag-row code { color: #d9e2ec; line-height: 1.5; white-space: pre-wrap; }
    .debug-flag { float: right; margin: 0 0 4px 8px; }
    .debug-flag--active { border-color: #ffc857; background: #6b4f16; color: #fff2b2; }
    @media (max-width: 600px) {
      .debug-panel { width: 100vw; }
      .debug-toggle {
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
      }
    }
    .home-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #1a1a2e;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 150ms ease-out, visibility 0s linear 150ms;
    }
    .home-screen--open {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transition: opacity 150ms ease-out;
    }
    .home-title {
      color: #f0f4f8;
      font-size: 42px;
      letter-spacing: .12em;
    }
    .home-auth {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(340px, 92vw);
      min-height: 34px;
      color: #9fb3c8;
      font-size: 12px;
    }
    .home-auth-status {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }
    .home-auth-button {
      flex: 0 0 auto;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #d9e2ec;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .home-auth-button:disabled { opacity: .6; cursor: default; }
    .home-mode-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(340px, 92vw);
    }
    .home-saved-game {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(340px, 92vw);
      border: 1px solid #62b0e8;
      border-radius: 8px;
      padding: 12px 14px;
      background: #102a43;
    }
    .home-saved-game[hidden] { display: none; }
    .home-saved-game-button {
      border: 1px solid #62b0e8;
      border-radius: 5px;
      padding: 8px 10px;
      background: #1769aa;
      color: #f0f4f8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .home-saved-game-button:hover { background: #1e7bc4; }
    .home-saved-game-context {
      color: #9ecdf0;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }
    .home-mode-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
      border: 1px solid #486581;
      border-radius: 8px;
      padding: 14px 16px;
      background: #102a43;
      color: #f0f4f8;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 120ms ease-out, background 120ms ease-out;
    }
    .home-mode-card:hover { border-color: #62b0e8; background: #16324f; }
    .home-mode-card strong { font-size: 18px; letter-spacing: .03em; }
    .home-mode-card p { color: #9fb3c8; font-size: 13px; line-height: 1.4; }
    .home-mode-best { color: #62b0e8; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .home-mode-record { color: #cbd5e1; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .home-mode-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      width: 100%;
    }
    .home-mode-action {
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #0b2034;
      color: #d9e2ec;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .home-mode-action:hover { border-color: #62b0e8; background: #16324f; }
    .home-mode-action--play { background: #1769aa; border-color: #62b0e8; }
    .home-mode-card--disabled {
      cursor: default;
      opacity: .55;
      border-style: dashed;
      align-items: center;
      color: #829ab1;
      font-size: 13px;
    }
    .home-mode-card--disabled:hover { border-color: #486581; background: #102a43; }
    .home-back-button {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 20;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #9fb3c8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 120ms ease-out, visibility 0s linear 120ms;
    }
    .home-back-button--visible {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transition: opacity 120ms ease-out;
    }
    .game-menu {
