<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Disco</title>
  <style>
    :root { --game-controls-height: 72px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #1a1a2e;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    .app-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #1a1a2e;
    }
    .shell-region {
      min-height: 0;
      pointer-events: none;
    }
    .shell-region--top { padding-top: env(safe-area-inset-top); }
    .shell-region--bottom {
      display: grid;
      place-items: center;
      min-height: calc(var(--game-controls-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
    }
    .game-controls {
      pointer-events: auto;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(500px, calc(100vw - 24px));
      min-height: 64px;
      padding: 8px 0;
    }
    .game-control {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #f0f4f8;
      font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      touch-action: manipulation;
    }
    .game-control--drop, .game-control--confirm { min-width: 76px; background: #1769aa; border-color: #62b0e8; }
    .game-control:hover:not(:disabled) { border-color: #62b0e8; background: #16324f; }
    .game-control:disabled { opacity: .38; cursor: default; }
    .game-control[hidden] { display: none; }
    @media (max-width: 420px) {
      .game-controls { gap: 4px; width: calc(100vw - 12px); }
      .game-control { min-width: 40px; padding-inline: 7px; }
      .game-control--drop, .game-control--confirm { min-width: 68px; }
    }
    @media (hover: hover) and (pointer: fine) and (min-width: 721px) {
      :root { --game-controls-height: 0px; }
      .shell-region--bottom { min-height: 0; padding-bottom: 0; }
      .game-controls { display: none; }
    }
    .game-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      flex: none;
      touch-action: none;
      cursor: pointer;
    }
    .debug-toggle {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      z-index: 20;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #9fb3c8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .debug-panel {
      position: fixed;
      z-index: 30;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      width: min(440px, 100vw);
      display: flex;
      flex-direction: column;
      color: #d9e2ec;
      background: rgba(9, 22, 38, .98);
      border-left: 1px solid #334e68;
      box-shadow: -12px 0 30px rgba(0, 0, 0, .45);
      transform: translateX(102%);
      transition: transform 150ms ease-out;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .debug-panel--open { transform: translateX(0); }
    .debug-panel > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid #334e68;
      color: #62b0e8;
      letter-spacing: .08em;
    }
    .debug-panel > header button {
      border: 0;
      padding: 4px 8px;
      color: #9fb3c8;
      background: transparent;
      font: 24px/1 sans-serif;
      cursor: pointer;
    }
    .debug-content {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }
    .debug-content h2 {
      margin: 18px 0 8px;
      color: #9fb3c8;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .debug-summary, .debug-alert, .debug-ok {
      padding: 9px 10px;
      border-radius: 4px;
      line-height: 1.45;
    }
    .debug-summary { background: #102a43; color: #bcccdc; }
    .debug-alert { margin-top: 10px; border: 1px solid #d64545; background: #4b1d26; color: #ffb3b3; }
    .debug-ok { margin-top: 10px; border: 1px solid #287d57; background: #123b32; color: #8ae6bd; }
    .debug-muted { margin: 12px 0; color: #829ab1; line-height: 1.5; }
    .debug-grid {
      display: grid;
      gap: 3px;
      width: 100%;
    }
    .debug-cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #334e68;
      border-radius: 3px;
      background: #102a43;
      color: #f0f4f8;
      font-weight: 700;
    }
    .debug-cell--empty { color: #486581; font-weight: 400; }
    .debug-cell--single-cracked, .debug-cell--double-cracked { background: #3e4c59; color: #d9e2ec; }
    .debug-cell--clearable {
      border-color: #ff6b6b;
      background: #7b2531;
      color: #fff;
      box-shadow: inset 0 0 0 1px #ff6b6b;
    }
    .debug-cell--flaggable { cursor: pointer; }
    .debug-cell--flagged {
      outline: 3px solid #ffc857;
      outline-offset: -3px;
      box-shadow: inset 0 0 0 1px #1a1a2e;
    }
    .debug-grid--compact { margin-top: 8px; max-width: 300px; }
    .debug-grid--compact .debug-cell { font-size: 10px; }
    .debug-content pre {
      margin: 7px 0;
      padding: 8px;
      overflow-x: auto;
      border-radius: 3px;
      background: #071a2b;
      color: #bcccdc;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    .debug-steps { color: #d9e2ec !important; }
    .debug-content details {
      margin: 5px 0;
      padding: 6px 8px;
      border: 1px solid #243b53;
      border-radius: 3px;
      background: #0b2034;
    }
    .debug-content summary { color: #9fb3c8; cursor: pointer; line-height: 1.4; }
    .debug-report textarea {
      width: 100%;
      resize: vertical;
      padding: 8px;
      border: 1px solid #486581;
      border-radius: 3px;
      color: #f0f4f8;
      background: #071a2b;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .debug-report-actions, .debug-flag-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .debug-report-actions { justify-content: space-between; margin-top: 8px; color: #9fb3c8; }
    .debug-report-actions button, .debug-flag {
      border: 1px solid #486581;
      border-radius: 3px;
      padding: 5px 7px;
      background: #102a43;
      color: #bcccdc;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    .debug-report-actions button { color: #fff; background: #1769aa; border-color: #62b0e8; }
    .debug-flag-row {
      align-items: flex-start;
      margin: 5px 0;
      padding: 7px;
      border-radius: 3px;
      background: #071a2b;
    }
    .debug-flag-row code { color: #d9e2ec; line-height: 1.5; white-space: pre-wrap; }
    .debug-flag { float: right; margin: 0 0 4px 8px; }
    .debug-flag--active { border-color: #ffc857; background: #6b4f16; color: #fff2b2; }
    @media (max-width: 600px) {
      .debug-panel { width: 100vw; }
      .debug-toggle {
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
      }
    }
    .home-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #1a1a2e;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease-out;
    }
    .home-screen--open {
      opacity: 1;
      pointer-events: auto;
    }
    .home-title {
      color: #f0f4f8;
      font-size: 42px;
      letter-spacing: .12em;
    }
    .home-auth {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(340px, 92vw);
      min-height: 34px;
      color: #9fb3c8;
      font-size: 12px;
    }
    .home-auth-status {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }
    .home-auth-button {
      flex: 0 0 auto;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #d9e2ec;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .home-auth-button:disabled { opacity: .6; cursor: default; }
    .home-mode-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(340px, 92vw);
    }
    .home-mode-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
      border: 1px solid #486581;
      border-radius: 8px;
      padding: 14px 16px;
      background: #102a43;
      color: #f0f4f8;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 120ms ease-out, background 120ms ease-out;
    }
    .home-mode-card:hover { border-color: #62b0e8; background: #16324f; }
    .home-mode-card strong { font-size: 18px; letter-spacing: .03em; }
    .home-mode-card p { color: #9fb3c8; font-size: 13px; line-height: 1.4; }
    .home-mode-best { color: #62b0e8; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .home-mode-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      width: 100%;
    }
    .home-mode-action {
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #0b2034;
      color: #d9e2ec;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .home-mode-action:hover { border-color: #62b0e8; background: #16324f; }
    .home-mode-action--play { background: #1769aa; border-color: #62b0e8; }
    .home-mode-card--disabled {
      cursor: default;
      opacity: .55;
      border-style: dashed;
      align-items: center;
      color: #829ab1;
      font-size: 13px;
    }
    .home-mode-card--disabled:hover { border-color: #486581; background: #102a43; }
    .home-back-button {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 20;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 7px 10px;
      background: #102a43;
      color: #9fb3c8;
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease-out;
    }
    .home-back-button--visible {
      opacity: 1;
      pointer-events: auto;
    }
    .game-menu {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: rgba(10, 16, 32, .72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease-out;
    }
    .game-menu--open {
      opacity: 1;
      pointer-events: auto;
    }
    .game-menu-panel {
      width: min(280px, 88vw);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border: 1px solid #486581;
      border-radius: 8px;
      background: #102a43;
      box-shadow: 0 18px 44px rgba(0, 0, 0, .45);
    }
    .game-menu-panel h2 {
      margin-bottom: 4px;
      color: #f0f4f8;
      font-size: 18px;
      letter-spacing: .12em;
      text-align: center;
    }
    .game-menu-button {
      min-height: 42px;
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 9px 12px;
      background: #0b2034;
      color: #d9e2ec;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .game-menu-button:hover { border-color: #62b0e8; background: #16324f; }
    .tutorial-overlay {
      position: fixed;
      left: 50%;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + var(--game-controls-height));
      z-index: 25;
      width: min(420px, calc(100vw - 20px));
      padding: 10px 12px;
      border: 1px solid #486581;
      border-radius: 8px;
      background: rgba(16, 42, 67, .96);
      color: #d9e2ec;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 120ms ease-out, transform 120ms ease-out;
    }
    .tutorial-overlay--visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .tutorial-eyebrow {
      color: #62b0e8;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tutorial-title {
      margin-top: 3px;
      color: #f0f4f8;
      font-size: 15px;
      font-weight: 700;
    }
    .tutorial-prompt {
      margin-top: 3px;
      color: #bcccdc;
      font-size: 13px;
      line-height: 1.35;
    }
    .tutorial-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 9px;
    }
    .tutorial-button {
      border: 1px solid #486581;
      border-radius: 5px;
      padding: 6px 9px;
      background: #0b2034;
      color: #d9e2ec;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .tutorial-button:hover { border-color: #62b0e8; background: #16324f; }
  </style>
</head>
<body>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
